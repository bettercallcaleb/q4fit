name: test
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile q4fit.py q4search.py q4multi.py q4cache.py q4scan.py q4tune.py q4tasks.py scripts/prepare_task_suite.py scripts/prepare_thinking_suite.py scripts/fetch_task_datasets.py
