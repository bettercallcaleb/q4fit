[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "q4fit"
version = "0.10.1"
description = "BF16-referenced, tensor-wise GGUF mixed-precision experiments"
requires-python = ">=3.10"
dependencies = ["gguf>=0.16", "requests>=2.31"]

[project.scripts]
q4fit = "q4fit:main"
q4fit-multi = "q4multi:main"
q4fit-cache = "q4cache:main"
q4fit-scan = "q4scan:main"
q4fit-tune = "q4tune:main"
q4fit-tasks = "q4tasks:main"
q4fit-depth = "q4depth:main"
q4fit-evidence = "q4evidence:main"

[tool.setuptools]
py-modules = ["q4fit", "q4search", "q4multi", "q4cache", "q4scan", "q4tune", "q4tasks", "q4depth", "q4evidence"]
packages = ["conceptladder", "conceptladder.hardcases"]

[tool.setuptools.package-data]
conceptladder = ["packs/*.json", "VENDOR.md"]
